app = "anchor-app"
primary_region = "dfw"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

# Persistent volume for SQLite database
# Create with: fly volumes create anchor_data --region dfw --size 1
[mounts]
  source = "anchor_data"
  destination = "/data"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/api/score/today"
    interval = "30s"
    timeout = "5s"
